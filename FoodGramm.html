<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="theme-color" content="#2f9e2c">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>FoodGramm</title>
<style>
:root{--g:#2f9e2c;--g2:#8cc63f;--r:#e8301f;--o:#f7941d;--n:#14213d;--bg:#f3f9ee}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--n);padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 6px #0001}
header img{width:38px;height:38px;object-fit:contain}header b{font-size:23px;font-weight:800}header b span{color:var(--g)}
main{padding:12px 14px;max-width:560px;margin:auto}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #14213d12}
.ring{display:flex;align-items:center;justify-content:space-around}.big{font-size:34px;font-weight:800}
small,.s{color:#667085;font-size:12px}
.dn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dn button{border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:20px;color:var(--g);box-shadow:0 1px 4px #0002}
.mb{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.mb span:first-child{width:50px}.mb span:last-child{width:68px;text-align:right}
.mb i{flex:1;height:9px;background:#e8f0e2;border-radius:9px;overflow:hidden}.mb u{display:block;height:100%;border-radius:9px}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.mh span{margin-left:auto;color:#667085;font-size:13px}
.plus{border:0;background:var(--g);color:#fff;border-radius:50%;width:30px;height:30px;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #edf3e8}
.r{display:flex;align-items:center;gap:10px}.x{border:0;background:none;color:#b0b7c3;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{border:1px solid #cfe3c2;background:#fff;border-radius:20px;padding:7px 14px;white-space:nowrap;color:var(--n)}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
input,select{width:100%;padding:11px;border:1px solid #d3e4c8;border-radius:11px;font:inherit;background:#fff;color:var(--n);margin:4px 0}
label{font-size:12px;color:#667085;display:block;margin-top:6px}
.btn{width:100%;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--g),var(--g2));margin-top:8px}
.btn.o{background:linear-gradient(90deg,var(--r),var(--o))}.btn.l{background:#fff;color:var(--g);border:1px solid var(--g)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;box-shadow:0 -2px 10px #0001;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:11px;color:#8a94a6}nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--g);font-weight:700}
.sel{border:2px solid var(--g)}.wt{display:flex;align-items:center;justify-content:center;gap:16px}
.wt button{border:0;border-radius:50%;width:40px;height:40px;font-size:22px;background:var(--g);color:#fff}
details summary{font-weight:700;color:var(--g);padding:4px 0}
.logo{display:block;margin:0 auto 6px;width:150px}
</style></head><body>

const $=s=>document.querySelector(s),M=['Breakfast','Lunch','Snacks','Dinner'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let S=null;try{S=JSON.parse(localStorage.getItem('fg')||'null')}catch(e){}
S=S||{prof:{sex:'m',age:30,h:170,w:70,act:1.375,goal:0},log:{},water:{},wt:{},custom:[]};
const save=()=>{try{localStorage.setItem('fg',JSON.stringify(S))}catch(e){}};
let tab='today',day=dk(new Date()),meal='Breakfast',q='',sel=null,plan=null;
const ALL=()=>DB.concat(S.custom),g=n=>DB.find(x=>x.n==n);
const tot=L=>L.reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{k:0,p:0,c:0,f:0});
function target(){const p=S.prof,b=10*p.w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161),k=Math.max(1200,Math.round(b*p.act+p.goal)),pr=Math.round(p.w*1.6),f=Math.round(k*.25/9);return{k,p:pr,f,c:Math.max(0,Math.round((k-pr*4-f*9)/4))}}
const go=t=>{tab=t;sel=null;render();scrollTo(0,0)};
function shift(n){const d=new Date(day+'T12:00');d.setDate(d.getDate()+n);day=dk(d);render()}
function del(i){S.log[day].splice(i,1);save();render()}
function water(n){S.water[day]=Math.max(0,(S.water[day]||0)+n);save();render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#main').innerHTML=({today:vToday,add:vAdd,plan:vPlan,prog:vProg,me:vMe})[tab]();if(tab=='add')res()}
function vToday(){const t=target(),L=S.log[day]||[],s=tot(L),left=t.k-s.k,C=2*Math.PI*54,col=left<0?'var(--r)':'var(--g)';
const ttl=day==dk(new Date())?'Today':new Date(day+'T12:00').toDateString().slice(0,10);
let h=`<div class="dn"><button onclick="shift(-1)">‹</button><b>${ttl}</b><button onclick="shift(1)">›</button></div>
<div class="card ring"><svg viewBox="0 0 130 130" width="130"><circle cx="65" cy="65" r="54" fill="none" stroke="#e6efe0" stroke-width="12"/><circle cx="65" cy="65" r="54" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*Math.min(s.k/t.k,1)} ${C}" transform="rotate(-90 65 65)"/><text x="65" y="63" text-anchor="middle" font-size="24" font-weight="800" fill="#14213d">${Math.round(s.k)}</text><text x="65" y="80" text-anchor="middle" font-size="11" fill="#667085">of ${t.k} kcal</text></svg><div><div class="big" style="color:${col}">${Math.abs(Math.round(left))}</div><small>kcal ${left<0?'over':'left'}</small></div></div>
<div class="card">`+[['Protein',s.p,t.p,'--o'],['Carbs',s.c,t.c,'--g2'],['Fat',s.f,t.f,'--r']].map(([n,v,gl,c])=>`<div class="mb"><span>${n}</span><i><u style="width:${Math.min(v/gl*100,100)}%;background:var(${c})"></u></i><span>${Math.round(v)}/${gl}g</span></div>`).join('')+`</div>`;
h+=M.map(m=>{const es=L.map((e,i)=>({e,i})).filter(x=>x.e.m==m),k=es.reduce((a,x)=>a+x.e.k,0);
return `<div class="card"><div class="mh"><b>${m}</b><span>${Math.round(k)} kcal</span><button class="plus" onclick="meal='${m}';go('add')">＋</button></div>`+es.map(({e,i})=>`<div class="row"><div><div>${esc(e.n)}</div><small>${+e.q.toFixed(2)} × ${esc(e.u)}</small></div><div class="r"><b>${Math.round(e.k)}</b><button class="x" onclick="del(${i})">✕</button></div></div>`).join('')+`</div>`}).join('');
return h+`<div class="card"><b>💧 Water</b><div class="wt"><button onclick="water(-1)">−</button><div><span class="big">${S.water[day]||0}</span><small> glasses</small></div><button onclick="water(1)">+</button></div></div>`}
function res(){const qq=q.toLowerCase(),a=ALL();$('#res').innerHTML=a.filter(f=>f.n.toLowerCase().includes(qq)).slice(0,40).map(f=>`<div class="row" onclick="sel=${a.indexOf(f)};render()"><div>${esc(f.n)}<br><small>${esc(f.u)} · P${f.p} C${f.c} F${f.f}</small></div><b>${f.k}</b></div>`).join('')||'<small>No match — add it as a custom food below.</small>'}
function vAdd(){let h=`<div class="chips">${M.map(m=>`<button class="${m==meal?'on':''}" onclick="meal='${m}';render()">${m}</button>`).join('')}</div>`;
if(sel!=null){const f=ALL()[sel];h+=`<div class="card sel"><b>${esc(f.n)}</b><br><small>per ${esc(f.u)} · ${f.k} kcal</small><label>Servings</label><input id="qty" type="number" step="0.25" min="0.25" value="1" oninput="$('#pv').textContent=Math.round(${f.k}*(+this.value||0))"><div class="s">≈ <b id="pv">${f.k}</b> kcal → ${meal}</div><button class="btn" onclick="addSel()">Add to ${meal}</button><button class="btn l" onclick="sel=null;render()">Cancel</button></div>`}
return h+`<input placeholder="🔍 Search food…" value="${esc(q)}" oninput="q=this.value;res()"><div class="card" id="res"></div>
<details class="card"><summary>＋ Custom food</summary><input id="cn" placeholder="Name"><input id="cu" placeholder="Serving (e.g. 1 bowl)"><div class="g2"><input id="ck" type="number" placeholder="kcal"><input id="cp" type="number" placeholder="Protein g"><input id="cc" type="number" placeholder="Carbs g"><input id="cf" type="number" placeholder="Fat g"></div><button class="btn" onclick="addCustom()">Save food</button></details>`}
function addSel(){const f=ALL()[sel],n=+$('#qty').value||1;(S.log[day]=S.log[day]||[]).push({m:meal,n:f.n,u:f.u,q:n,k:f.k*n,p:f.p*n,c:f.c*n,f:f.f*n});save();go('today')}
function addCustom(){const n=$('#cn').value.trim();if(!n||!+$('#ck').value)return alert('Enter a name and calories');S.custom.push({n,u:$('#cu').value.trim()||'1 serving',k:+$('#ck').value,p:+$('#cp').value||0,c:+$('#cc').value||0,f:+$('#cf').value||0});save();q=n;render()}
const SPLIT={Breakfast:.25,Lunch:.35,Snacks:.1,Dinner:.3},
BF=['Idli','Poha','Upma','Oats porridge (milk)','Besan chilla','Omelette (2 eggs)','Plain paratha','Brown bread','Milk (toned)','Banana','Curd (dahi)','Sprouts (moong)'],
MN=['Dal (cooked)','Rajma','Chole','Paneer bhurji','Mixed veg sabzi','Palak paneer','Chicken curry','Grilled chicken breast','Fish curry','Moong dal khichdi','Tofu','Salad (cucumber, tomato)','Curd (dahi)','Steamed rice'],
SN=['Apple','Orange','Almonds','Makhana (roasted)','Buttermilk (chaas)','Coconut water','Papaya','Peanuts (roasted)','Sprouts (moong)'];
function gen(){const T=target().k;plan={};M.forEach(m=>{const b=T*SPLIT[m],main=m=='Lunch'||m=='Dinner',pool=(main?MN:m=='Snacks'?SN:BF).slice().sort(()=>Math.random()-.5);let it=[],s=0;
if(main){it.push({f:g('Roti (chapati)'),q:2});s=208}

function saveMe(){S.prof={sex:$('#sx').value,age:+$('#ag').value||30,h:+$('#ht').value||170,w:+$('#wg').value||70,act:+$('#ac').value,goal:+$('#gl').value};save();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='foodgramm-backup.json';a.click()}
